<!DOCTYPE html>
<html>
<head>
    <title>SITBOT</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-wrapper">

    <div class="chat-header">
        <img src="/static/logo.png">
        <span>SITBOT</span>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask something..." autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
const urlMap = {
    "Admissions": "https://sitnagpur.edu.in/first-year-admission-procedure",
    "Fees": "https://sitnagpur.edu.in/fees-structure",
    "College Timings": "https://sitnagpur.edu.in/",
    "Courses Offered": "https://sitnagpur.edu.in/courses",
    "Placements": "https://sitnagpur.edu.in/placement-record",
    "Hostel Facilities": "https://sitnagpur.edu.in/hostel-facilities",
    "Library": "https://sitnagpur.edu.in/",
    "Scholarships": "https://sitnagpur.edu.in/scholarships",
    "Contact Details": "https://sitnagpur.edu.in/contactus",
    "Location / Address": "https://goo.gl/maps/example"
};

function navigateTo(text) {
    const url = urlMap[text];
    if (url) {
        window.location.href = url;
    }
}

function quickSend(text) {
    document.getElementById("user-input").value = text;
    sendMessage();
}

function toggleMore(btn) {
    const more = document.getElementById("more-options");
    more.classList.toggle("hidden");
    btn.innerHTML = more.classList.contains("hidden") ? "➕ More" : "➖ Less";
}

function sendMessage() {
    const input = document.getElementById("user-input");
    const msg = input.value.trim();
    if (!msg) return;

    const chatBox = document.getElementById("chat-box");

    // Remove old suggestion rows
    document.querySelectorAll(".suggestion-row").forEach(e => e.remove());

    // User message
    const userDiv = document.createElement("div");
    userDiv.className = "user-msg";
    userDiv.innerHTML = `<div class="bubble">${msg}</div>`;
    chatBox.appendChild(userDiv);
    input.value = "";

    fetch("/get", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "msg=" + encodeURIComponent(msg)
    })
    .then(res => res.json())
    .then(data => {

        // Typing indicator
        const typingDiv = document.createElement("div");
        typingDiv.className = "bot-msg";
        typingDiv.innerHTML = `
            <img src="/static/logo.png">
            <div class="bubble typing-bubble">
                SITBOT is typing<span class="dots"></span>
            </div>
        `;
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        setTimeout(() => {
            typingDiv.remove();

            const botDiv = document.createElement("div");
            botDiv.className = "bot-msg";
            
            if (data.type === "buttons") {
                // Render message with buttons
                let buttonsHTML = `
                    <img src="/static/logo.png">
                    <div class="bubble">
                        ${data.message}
                        <div class="buttons-container">
                `;
                data.buttons.forEach(btn => {
                    buttonsHTML += `<button class="quick-btn" onclick="navigateTo('${btn}')">${btn}</button>`;
                });
                buttonsHTML += `
                        </div>
                    </div>
                `;
                botDiv.innerHTML = buttonsHTML;
            } else {
                // Render regular text message
                botDiv.innerHTML = `
                    <img src="/static/logo.png">
                    <div class="bubble">
                        ${data.message.replace(
                            /(https?:\/\/[^\s]+)/g,
                            '<a href="$1" target="_blank">$1</a>'
                        )}
                    </div>
                `;
            }
            
            chatBox.appendChild(botDiv);

            chatBox.scrollTop = chatBox.scrollHeight;
        }, 800);
    });
}

document.getElementById("user-input")
    .addEventListener("keypress", e => {
        if (e.key === "Enter") sendMessage();
    });

// Display initial greeting when page loads
function displayInitialGreeting() {
    const chatBox = document.getElementById("chat-box");
    const botDiv = document.createElement("div");
    botDiv.className = "bot-msg";
    
    const buttonsHTML = `
        <img src="/static/logo.png">
        <div class="bubble">
            Hi 👋 How can I help you today?
            <div class="buttons-container">
                <button class="quick-btn" onclick="navigateTo('Admissions')">Admissions</button>
                <button class="quick-btn" onclick="navigateTo('Fees')">Fees</button>
                <button class="quick-btn" onclick="navigateTo('College Timings')">College Timings</button>
                <button class="quick-btn" onclick="navigateTo('Courses Offered')">Courses Offered</button>
                <button class="quick-btn" onclick="navigateTo('Placements')">Placements</button>
                <button class="quick-btn" onclick="navigateTo('Hostel Facilities')">Hostel Facilities</button>
                <button class="quick-btn" onclick="navigateTo('Library')">Library</button>
                <button class="quick-btn" onclick="navigateTo('Scholarships')">Scholarships</button>
                <button class="quick-btn" onclick="navigateTo('Contact Details')">Contact Details</button>
                <button class="quick-btn" onclick="navigateTo('Location / Address')">Location / Address</button>
            </div>
        </div>
    `;
    botDiv.innerHTML = buttonsHTML;
    chatBox.appendChild(botDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Initialize greeting on page load
window.addEventListener("load", displayInitialGreeting);
</script>

</body>
</html>
